<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Luke Europe">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d0d0d" id="themeColor">
<title>Luke's Europe 2026</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/regular/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/fill/style.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
/* ─── Design tokens ─────────────────────────────────────── */
:root {
  --font: -apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif;

  /* Dark mode (default) */
  --bg:   #0d0d0d;
  --s1:   #181818;
  --s2:   #222;
  --s3:   #2d2d2d;
  --tx:   #f0ede8;
  --tx2:  #888;
  --tx3:  #484848;
  --bd:   rgba(255,255,255,.07);
  --bd2:  rgba(255,255,255,.13);

  --ac:      #F26419;
  --ac-dim:  rgba(242,100,25,.13);
  --ac-tx:   #F58A50;
  --ok:      #4ade80;
  --ok-dim:  rgba(74,222,128,.12);
  --ok-tx:   #4ade80;
  --warn:    #fbbf24;
  --warn-dim:rgba(251,191,36,.12);
  --warn-tx: #fbbf24;
  --err:     #f87171;

  /* Phase colours */
  --p1:#E07B5A; --p2:#4A9E7A; --p3:#E8A23C; --p4:#5A7EC4;

  /* Spacing */
  --sp1:4px; --sp2:8px; --sp3:12px; --sp4:16px;
  --sp5:20px; --sp6:24px; --sp8:32px;

  /* Radius */
  --r-sm:10px; --r-md:16px; --r-lg:22px; --r-xl:28px; --r-full:999px;

  /* Spring easing */
  --spring: linear(
    0, 0.009, 0.035 2.1%, 0.141 4.4%, 0.723 12.4%,
    0.938 16%, 1.017, 1.06, 1.076 22.3%, 1.07 24%,
    1.013 27.3%, 0.992 29.2%, 0.977 31.5%, 0.975 33%,
    0.984 36.8%, 1.001 40%, 1.006 43.3%, 1 50%
  );
}

body.light {
  --bg:  #f4f2ef;
  --s1:  #ffffff;
  --s2:  #edeae5;
  --s3:  #e0dbd4;
  --tx:  #141210;
  --tx2: #5C574F;
  --tx3: #9C968C;
  --bd:  rgba(0,0,0,.08);
  --bd2: rgba(0,0,0,.15);
}

/* ─── Reset ─────────────────────────────────────────────── */
*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
html { -webkit-text-size-adjust:100%; }
* { -webkit-tap-highlight-color:transparent; }
::-webkit-scrollbar { display:none; }
* { scrollbar-width:none; }
button,input { font-family:var(--font); }
button { cursor:pointer; border:none; background:none; color:inherit; }

/* ─── Base ───────────────────────────────────────────────── */
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--tx);
  max-width: 430px;
  margin: 0 auto;
  min-height: 100vh;
  min-height: 100dvh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  transition: background .3s, color .3s;
}

#app { display:flex; flex-direction:column; height:100vh; height:100dvh; }
#main {
  flex:1; overflow-y:auto; overscroll-behavior:contain;
  padding-bottom: calc(env(safe-area-inset-bottom,0px) + 68px);
}

/* ─── Panes ──────────────────────────────────────────────── */
.pane { display:none; }
.pane.on { display:block; }

/* ─── Bottom Nav ─────────────────────────────────────────── */
#nav {
  position:fixed; bottom:0; left:50%; transform:translateX(-50%);
  width:100%; max-width:430px;
  background: rgba(13,13,13,.88);
  backdrop-filter: blur(24px) saturate(200%);
  -webkit-backdrop-filter: blur(24px) saturate(200%);
  border-top: 1px solid var(--bd);
  padding-bottom: env(safe-area-inset-bottom,0);
  z-index:100; display:flex;
  transition: background .3s;
}
body.light #nav { background: rgba(244,242,239,.9); }

.nbtn {
  flex:1; display:flex; flex-direction:column; align-items:center;
  justify-content:center; gap:3px;
  padding:10px 0 11px;
  color:var(--tx3); font-size:9px; font-weight:700;
  letter-spacing:.07em; text-transform:uppercase;
  transition: color .2s, transform .4s var(--spring);
}
.nbtn:active { transform:scale(.86); }
.nbtn.on { color:var(--ac); }
.nbtn i { font-size:21px; line-height:1; }

/* ─── Typography ─────────────────────────────────────────── */
.label {
  font-size:10px; font-weight:700; letter-spacing:.1em;
  text-transform:uppercase; color:var(--tx3);
}
.cap   { font-size:12px; font-weight:500; color:var(--tx2); }
.body  { font-size:15px; line-height:1.5; }
.title { font-size:17px; font-weight:600; line-height:1.3; letter-spacing:-.01em; }
.head  { font-size:22px; font-weight:700; line-height:1.2; letter-spacing:-.02em; }

.muted  { color:var(--tx2); }
.dim    { color:var(--tx3); }
.accent { color:var(--ac); }
.ok-tx  { color:var(--ok); }
.warn-tx{ color:var(--warn); }

/* ─── Spacing helpers ────────────────────────────────────── */
.px { padding-left:var(--sp4); padding-right:var(--sp4); }
.mt2{margin-top:var(--sp2)} .mt3{margin-top:var(--sp3)} .mt4{margin-top:var(--sp4)}
.mt5{margin-top:var(--sp5)} .mt6{margin-top:var(--sp6)} .mt8{margin-top:var(--sp8)}
.mb2{margin-bottom:var(--sp2)} .mb3{margin-bottom:var(--sp3)} .mb4{margin-bottom:var(--sp4)}
.mb5{margin-bottom:var(--sp5)} .mb6{margin-bottom:var(--sp6)}
.pt4{padding-top:var(--sp4)} .pt5{padding-top:var(--sp5)} .pt6{padding-top:var(--sp6)}
.pb4{padding-bottom:var(--sp4)}

/* ─── Layout ─────────────────────────────────────────────── */
.row    { display:flex; align-items:center; gap:var(--sp3); }
.col    { display:flex; flex-direction:column; }
.between{ justify-content:space-between; }
.wrap   { flex-wrap:wrap; }
.grow1  { flex:1; }
.gap2   { gap:var(--sp2); }
.gap3   { gap:var(--sp3); }

/* ─── Cards ──────────────────────────────────────────────── */
.card {
  background:var(--s1); border-radius:var(--r-lg);
  padding:var(--sp4);
  border:1px solid var(--bd);
  transition: background .3s, border-color .3s;
}
.card-ac { background:var(--ac-dim)!important; border-color:rgba(242,100,25,.25)!important; }
.card-ok { background:var(--ok-dim)!important; border-color:rgba(74,222,128,.2)!important; }
.card-wn { background:var(--warn-dim)!important; border-color:rgba(251,191,36,.2)!important; }

/* ─── Badges ─────────────────────────────────────────────── */
.badge {
  display:inline-flex; align-items:center; gap:4px;
  font-size:11px; font-weight:700; letter-spacing:.02em;
  padding:3px 8px; border-radius:var(--r-full);
  white-space:nowrap;
}
.b-ok   { background:var(--ok-dim);   color:var(--ok);   border:1px solid rgba(74,222,128,.2); }
.b-warn { background:var(--warn-dim); color:var(--warn); border:1px solid rgba(251,191,36,.2); }
.b-ac   { background:var(--ac-dim);   color:var(--ac);   border:1px solid rgba(242,100,25,.25); }
.b-dim  { background:var(--s2);       color:var(--tx2);  border:1px solid var(--bd); }

/* ─── Icon container ─────────────────────────────────────── */
.ico {
  width:40px; height:40px; border-radius:var(--r-sm);
  background:var(--s2); border:1px solid var(--bd);
  display:flex; align-items:center; justify-content:center;
  font-size:18px; flex-shrink:0;
  transition: background .3s;
}
.ico-ac { background:var(--ac-dim)!important; border-color:rgba(242,100,25,.2)!important; }
.ico-ok { background:var(--ok-dim)!important; border-color:rgba(74,222,128,.15)!important; }
.ico i  { font-size:18px; }

/* ─── List rows ──────────────────────────────────────────── */
.list-row {
  display:flex; align-items:center; gap:var(--sp3);
  padding:var(--sp3) 0;
  border-bottom:1px solid var(--bd);
  min-height:52px;
}
.list-row:last-child { border-bottom:none; }

/* ─── Progress bar ───────────────────────────────────────── */
.prog-rail { height:4px; background:var(--s3); border-radius:var(--r-full); overflow:hidden; }
.prog-bar  { height:100%; background:var(--ac); border-radius:var(--r-full); transition:width .6s ease; }

/* ─── TODAY — Hero ───────────────────────────────────────── */
.today-util {
  display:flex; justify-content:flex-end; gap:var(--sp2);
  padding: calc(env(safe-area-inset-top,0px) + 10px) var(--sp4) 0;
}
.util-btn {
  width:36px; height:36px; border-radius:var(--r-full);
  background:var(--s2); border:1px solid var(--bd);
  display:flex; align-items:center; justify-content:center;
  color:var(--tx2); font-size:16px;
  transition: background .2s, transform .3s var(--spring);
}
.util-btn:active { transform:scale(.88); }
.util-btn i { font-size:17px; }

.today-hero {
  padding: var(--sp6) var(--sp4) var(--sp4);
  min-height:220px;
  display:flex; flex-direction:column; justify-content:flex-end;
}
.hero-eyebrow {
  font-size:11px; font-weight:700; letter-spacing:.12em;
  text-transform:uppercase; color:var(--tx3);
  margin-bottom:var(--sp2);
}
.hero-display {
  font-size: clamp(64px, 17vw, 96px);
  font-weight:900; letter-spacing:-.04em; line-height:.9;
  color:var(--ac);
  text-shadow:
    0 2px 0 rgba(0,0,0,.3),
    0 6px 20px rgba(242,100,25,.25);
}
body.light .hero-display {
  text-shadow:
    0 2px 0 rgba(0,0,0,.1),
    0 6px 20px rgba(242,100,25,.2);
}
.hero-sub {
  font-size:17px; font-weight:500; color:var(--tx2);
  margin-top:var(--sp3); letter-spacing:-.01em;
}

/* ─── TODAY — Sections ───────────────────────────────────── */
.sec-hdr {
  display:flex; align-items:center; justify-content:space-between;
  margin-bottom:var(--sp3);
}
.sec-action {
  font-size:12px; font-weight:600; color:var(--ac);
  letter-spacing:.01em;
}

/* Flight card */
.flt-card {
  background:var(--s1); border:1px solid var(--bd);
  border-radius:var(--r-lg); padding:var(--sp4);
  transition:background .3s;
}
.flt-route {
  display:flex; align-items:center; justify-content:space-between;
  margin-bottom:var(--sp3);
}
.flt-code { font-size:26px; font-weight:800; letter-spacing:-.03em; }
.flt-arrow { color:var(--ac); font-size:20px; }
.flt-meta { font-size:13px; color:var(--tx2); font-weight:500; }

/* ─── TIMELINE ───────────────────────────────────────────── */

/* Phase jump tabs — sticky at top of scroll pane */
.tl-tabs {
  position:sticky; top:0; z-index:9;
  display:flex; gap:var(--sp2); overflow-x:auto;
  padding:var(--sp3) var(--sp4);
  background:var(--bg); border-bottom:1px solid var(--bd);
  transition:background .3s;
}
.tl-tab {
  display:flex; align-items:center; gap:5px;
  padding:5px 11px; border-radius:var(--r-full);
  border:1px solid var(--bd); background:var(--s2);
  font-size:11px; font-weight:700; letter-spacing:.04em;
  text-transform:uppercase; color:var(--tx2);
  white-space:nowrap; flex-shrink:0;
  transition:background .2s, transform .3s var(--spring);
}
.tl-tab:active { transform:scale(.93); }
.tl-tab-dot { width:6px; height:6px; border-radius:var(--r-full); flex-shrink:0; }

/* Phase header */
.phase-hdr {
  display:flex; align-items:center; gap:var(--sp2);
  padding:var(--sp6) var(--sp4) var(--sp3);
}
.phase-dot { width:8px; height:8px; border-radius:var(--r-full); flex-shrink:0; }
.phase-label { font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; }

/* Day card */
.day-wrap { padding:0 var(--sp4) var(--sp3); }
.day-card {
  background:var(--s1); border-radius:var(--r-lg);
  border:1px solid var(--bd); overflow:hidden;
  transition:background .3s, border-color .3s;
}
.day-card.today { border-color:rgba(242,100,25,.4); }
.day-card.past  { opacity:.55; }

/* Tap-to-expand header */
.day-tog {
  display:flex; align-items:center; gap:var(--sp3);
  padding:var(--sp3); cursor:pointer;
  -webkit-user-select:none; user-select:none;
}
.day-tog:active { background:var(--s2); }

/* City thumbnail */
.day-thumb {
  width:58px; height:58px; border-radius:var(--r-md);
  flex-shrink:0; overflow:hidden; position:relative;
}
.day-thumb-bg { position:absolute; inset:0; }
.day-thumb-em {
  position:absolute; inset:0; display:flex;
  align-items:center; justify-content:center; font-size:24px;
}
.day-thumb img {
  position:absolute; inset:0; width:100%; height:100%;
  object-fit:cover; opacity:0; transition:opacity .5s;
}
.day-thumb img.vis { opacity:1; }

/* Text meta */
.day-tog-meta { flex:1; min-width:0; }
.day-tog-city {
  font-size:15px; font-weight:700; letter-spacing:-.01em;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.day-tog-city.ac { color:var(--ac); }
.day-tog-date { font-size:12px; color:var(--tx2); margin-top:1px; }
.day-tog-badge { margin-top:5px; }

/* Expand caret */
.day-caret { font-size:18px; color:var(--tx3); flex-shrink:0;
  transition:transform .3s var(--spring); }
.day-card.open .day-caret { transform:rotate(180deg); }

/* Animated body */
.day-body { overflow:hidden; height:0; transition:height .3s ease; }
.day-body-inner { padding:var(--sp3); border-top:1px solid var(--bd); }

/* Highlights */
.day-hl {
  display:flex; align-items:flex-start; gap:var(--sp2);
  padding:2px 0; font-size:13px; color:var(--tx2); line-height:1.5;
}
.day-hl::before {
  content:''; width:4px; height:4px; border-radius:var(--r-full);
  background:var(--tx3); flex-shrink:0; margin-top:7px;
}

/* Flight inline */
.day-flt {
  background:var(--ac-dim); border:1px solid rgba(242,100,25,.2);
  border-radius:var(--r-md); padding:var(--sp3) var(--sp4);
  margin-bottom:var(--sp3);
}
.day-flt-route {
  display:flex; align-items:center; justify-content:space-between;
  margin-bottom:var(--sp2);
}
.day-flt-code { font-size:20px; font-weight:800; letter-spacing:-.02em; }
.day-flt-arrow { color:var(--ac); }
.day-flt-meta  { font-size:12px; color:var(--tx2); font-weight:500; }

/* Guide CTA inside card */
.cta-sm {
  display:inline-flex; align-items:center; gap:6px;
  padding:7px 14px; border-radius:var(--r-full);
  background:var(--ac-dim); color:var(--ac);
  border:1px solid rgba(242,100,25,.25);
  font-size:13px; font-weight:600; margin-top:var(--sp3);
  transition:opacity .15s, transform .3s var(--spring);
}
.cta-sm:active { opacity:.8; transform:scale(.96); }

/* ─── CITIES ─────────────────────────────────────────────── */
.city-scroll {
  display:flex; gap:var(--sp2);
  padding:var(--sp4) var(--sp4) 0;
  overflow-x:auto;
}
.city-chip {
  white-space:nowrap; padding:7px var(--sp4);
  border-radius:var(--r-full);
  border:1px solid var(--bd);
  background:var(--s2); font-size:13px; font-weight:600;
  color:var(--tx2); min-height:36px;
  transition: background .2s, color .2s, border-color .2s, transform .3s var(--spring);
}
.city-chip:active { transform:scale(.94); }
.city-chip.on {
  background:var(--ac); border-color:var(--ac); color:#fff;
}

.city-hero {
  position:relative; height:200px; overflow:hidden;
  margin-top:var(--sp4);
}
.city-hero-bg {
  position:absolute; inset:0;
}
.city-hero-grad {
  position:absolute; inset:0;
  background:linear-gradient(to top, rgba(0,0,0,.82) 0%, rgba(0,0,0,.2) 55%, transparent 100%);
}
.city-hero-em {
  position:absolute; inset:0; display:flex; align-items:center;
  justify-content:center; font-size:72px; opacity:.2; pointer-events:none;
}
.city-hero-txt {
  position:absolute; bottom:0; left:0; right:0; padding:var(--sp4);
}
.city-hero-name {
  font-size:32px; font-weight:800; letter-spacing:-.03em;
  color:#fff; line-height:1;
}
.city-hero-sub {
  font-size:13px; color:rgba(255,255,255,.65); margin-top:4px; font-weight:500;
}

.guide-sec { margin-bottom:var(--sp6); }
.guide-hdr {
  display:flex; align-items:center; gap:var(--sp2);
  margin-bottom:var(--sp3);
}
.guide-hdr-icon {
  width:28px; height:28px; border-radius:var(--r-sm);
  background:var(--ac-dim); border:1px solid rgba(242,100,25,.2);
  display:flex; align-items:center; justify-content:center;
  flex-shrink:0;
}
.guide-hdr-icon i { font-size:14px; color:var(--ac); }
.guide-hdr-label {
  font-size:13px; font-weight:700; letter-spacing:.02em; color:var(--tx);
}

.guide-item {
  display:flex; align-items:flex-start; gap:var(--sp2);
  padding:var(--sp2) 0; border-bottom:1px solid var(--bd);
  font-size:14px; color:var(--tx2); line-height:1.55;
}
.guide-item:last-child { border-bottom:none; }
.guide-item::before {
  content:''; width:4px; height:4px; border-radius:var(--r-full);
  background:var(--ac); opacity:.6; flex-shrink:0; margin-top:7px;
}

.review-card {
  background:var(--s2); border:1px solid var(--bd);
  border-radius:var(--r-md); padding:var(--sp3) var(--sp4);
  margin-bottom:var(--sp3); transition:background .3s;
}
.review-place { font-size:14px; font-weight:700; color:var(--tx); }
.review-rating { font-size:12px; font-weight:700; color:var(--ac); }
.review-txt { font-size:13px; color:var(--tx2); line-height:1.6; margin-top:4px; }
.stars { letter-spacing:.05em; }

/* ─── GOALS ──────────────────────────────────────────────── */
.goal-cat-hdr {
  font-size:11px; font-weight:700; letter-spacing:.1em;
  text-transform:uppercase; color:var(--tx3);
  padding: var(--sp5) 0 var(--sp3);
  border-bottom:1px solid var(--bd);
  margin-bottom:2px;
}

.goal-item {
  display:flex; align-items:center; gap:var(--sp3);
  padding:var(--sp3) 0; border-bottom:1px solid var(--bd);
  min-height:52px; cursor:pointer;
  -webkit-user-select:none; user-select:none;
  transition: opacity .2s;
}
.goal-item:last-child { border-bottom:none; }
.goal-item:active { opacity:.7; }

.goal-chk {
  width:24px; height:24px; border-radius:8px;
  border:2px solid var(--bd2); flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  transition: background .2s, border-color .2s, transform .5s var(--spring);
}
.goal-chk.on {
  background:var(--ac); border-color:var(--ac);
  transform:scale(1.08);
}
.goal-chk.on::after {
  content:''; width:10px; height:6px;
  border-left:2px solid #fff; border-bottom:2px solid #fff;
  transform:rotate(-45deg) translateY(-1px); display:block;
}
.goal-lbl {
  flex:1; font-size:15px; font-weight:500; line-height:1.35;
  transition:color .2s;
}
.goal-lbl.done { color:var(--tx3); text-decoration:line-through; }
.goal-locked {
  font-size:10px; font-weight:700; letter-spacing:.06em;
  text-transform:uppercase; color:var(--ac); flex-shrink:0;
}

/* ─── BUDGET ─────────────────────────────────────────────── */
.budget-hero {
  display:grid; grid-template-columns:1fr 1fr; gap:var(--sp3);
  margin-bottom:var(--sp5);
}
.budget-tile {
  background:var(--s1); border:1px solid var(--bd);
  border-radius:var(--r-lg); padding:var(--sp4);
  transition:background .3s;
}
.budget-tile-label { font-size:10px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--tx3); margin-bottom:var(--sp2); }
.budget-tile-num {
  font-size:28px; font-weight:800; letter-spacing:-.03em;
  line-height:1; color:var(--tx);
}
.budget-tile-num.accent { color:var(--ac); }
.budget-tile-num.over   { color:var(--err); }

.budget-cat-hdr {
  display:flex; align-items:center; justify-content:space-between;
  padding: var(--sp3) 0; border-bottom:1px solid var(--bd);
  margin-bottom:2px;
}
.budget-cat-hdr-label { font-size:10px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--tx3); }

.budget-row {
  display:flex; align-items:center; gap:var(--sp3);
  padding: var(--sp2) 0; border-bottom:1px solid var(--bd);
  min-height:52px;
}

.sheet {

  width:100%; max-height:88vh; max-height:88dvh; overflow-y:auto;
  transform:translateY(24px);
  transition:transform .3s var(--spring);
}
.ovl.on .sheet { transform:none; }
.sheet-handle {
  width:36px; height:4px; border-radius:var(--r-full);
  background:var(--bd2); margin:0 auto var(--sp5);
}
.sheet-title { font-size:20px; font-weight:700; text-align:center; margin-bottom:var(--sp2); letter-spacing:-.02em; }
.sheet-sub { font-size:13px; color:var(--tx2); text-align:center; line-height:1.6; margin-bottom:var(--sp4); }

.url-box {

  border-radius:var(--r-md); padding:var(--sp3) var(--sp4);
  font-size:12px; font-weight:600; color:var(--ac-tx);
  word-break:break-all; margin:var(--sp3) 0; text-align:center;
}

.inst-blk {
  background:var(--s2); border:1px solid var(--bd);
  border-radius:var(--r-md); padding:var(--sp4);
  margin-bottom:var(--sp3);
}
.inst-blk-hdr { font-size:13px; font-weight:700; margin-bottom:var(--sp3); }
.inst-step {
  display:flex; gap:var(--sp3); align-items:flex-start;
  padding:var(--sp2) 0; border-bottom:1px solid var(--bd);
}
.inst-step:last-child { border-bottom:none; }
.inst-num {
  width:22px; height:22px; border-radius:var(--r-full);
  background:var(--ac); color:#fff;
  font-size:10px; font-weight:700;
  display:flex; align-items:center; justify-content:center;

}
.inst-txt { font-size:13px; color:var(--tx2); line-height:1.5; }

.cta-btn {

  font-size:16px; font-weight:700; margin-top:var(--sp4);

}

/* ─── Trip phase strip ───────────────────────────────────── */

/* ─── Phase kanban strip ─────────────────────────────────── */
.phase-scroll {
  display:flex; gap:var(--sp3); overflow-x:auto;

.pk-card {

}
.pk-card.pk-active { border-color:rgba(242,100,25,.45); }

.pk-hdr { display:flex; align-items:center; gap:6px; margin-bottom:5px; }
.pk-dot { width:7px; height:7px; border-radius:50%; flex-shrink:0; }
.pk-name { font-size:10px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; flex:1; }

}
.bk-toggle:active { background:var(--s2); }
.bk-list { display:none; padding:0 var(--sp4) var(--sp3); border-top:1px solid var(--bd); }
.bk-row {

.fab {

.fab:active { transform:scale(.9); }

/* ─── Weather ────────────────────────────────────────────── */
function weatherCityFor(entry){
  if(!entry) return 'Athens';
  var parts=entry.c.split(' → ');
  for(var i=parts.length-1;i>=0;i--){ var ct=parts[i].trim(); if(COORDS[ct]) return ct; }
  return null;
}
function fetchWeather(city){
  if(!city||!COORDS[city]) return;
  var key=city+'_'+TODAY.toISOString().split('T')[0];
  if(_wxCache[key]){ paintWeather(_wxCache[key]); return; }
  var c=COORDS[city];
  fetch('https://api.open-meteo.com/v1/forecast?latitude='+c[0]+'&longitude='+c[1]
    +'&current=temperature_2m,weathercode&daily=temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=1')
    .then(function(r){return r.json();})
    .then(function(d){ _wxCache[key]=d; paintWeather(d); })
    .catch(function(){ var e=g('wxZone'); if(e) e.style.display='none'; });
}
function paintWeather(d){
  var el=g('wxZone'); if(!el||!d||!d.current) return;
  var code=d.current.weathercode||0;
  var cur=Math.round(d.current.temperature_2m);
  var hi=d.daily?Math.round(d.daily.temperature_2m_max[0]):cur;
  var lo=d.daily?Math.round(d.daily.temperature_2m_min[0]):cur;
  var w=WMO[code]||'🌡️ Weather'; var ico=w.split(' ')[0]; var desc=w.split(' ').slice(1).join(' ');
  el.innerHTML='<div class="weather-row">'
    +'<div class="weather-ico">'+ico+'</div>'
    +'<div class="grow1"><div class="weather-temp">'+cur+'°C'
    +'<span style="font-size:12px;font-weight:500;color:var(--tx2);margin-left:8px">'+lo+'° – '+hi+'°</span></div>'
    +'<div class="weather-desc">'+desc+'</div></div>'
    +'</div>';
}

function renderTripVis(){

  for(var i=0;i<DAYS.length;i++){

  }
  out+='</div><div class="trip-legend">';
  lp=0;
  for(var i=0;i<DAYS.length;i++){
    var d=DAYS[i];
    if(d.p!==lp){
      if(lp!==0) out+='<div style="width:3px;flex-shrink:0"></div>';
      lp=d.p;
      var cnt=0; for(var k=0;k<DAYS.length;k++) if(DAYS[k].p===lp) cnt++;
      out+='<div class="trip-legend-item" style="flex:'+cnt+';color:'+PC[lp]+'">'+PN[lp]+'</div>';

var _map=null, _mapInited=false, _mapOpen=true;
function initRouteMap(){
  if(typeof L==='undefined') return;
  var el=document.getElementById('routeMap');
  if(!el) return;
  // If already created, just fix dimensions (re-entering hidden pane)
  if(_mapInited&&_map){ _map.invalidateSize(true); return; }
  _mapInited=true;
  _map=L.map('routeMap',{zoomControl:false,attributionControl:false,scrollWheelZoom:false,dragging:true});
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{subdomains:'abcd',maxZoom:19,minZoom:3}).addTo(_map);
  var coords=ROUTE.map(function(c){return COORDS[c];});
  L.polyline(coords,{color:'#F26419',weight:2.5,opacity:.9,dashArray:'5 7'}).addTo(_map);
  var seen={};
  for(var ri=0;ri<ROUTE.length;ri++){
    var c=ROUTE[ri];
    if(seen[c]||!COORDS[c]) continue; seen[c]=true;
    L.circleMarker(COORDS[c],{radius:6,fillColor:'#F26419',color:'#1a1a1a',weight:2,fillOpacity:1})
      .addTo(_map).bindPopup('<strong style="font-size:13px">'+c+'</strong>');
  }
  _map.fitBounds(L.latLngBounds(coords),{padding:[24,24]});
}
function toggleMap(){
  _mapOpen=!_mapOpen;
  var wrap=document.getElementById('mapWrap');
  var caret=document.getElementById('mapCaret');
  if(!wrap) return;
  if(_mapOpen){
    wrap.style.height='260px';
    if(caret) caret.classList.add('open');
    setTimeout(initRouteMap,80);
  } else {
    wrap.style.height='0';
    if(caret) caret.classList.remove('open');
  }
}

/* ─── Phase kanban ───────────────────────────────────────── */
function renderPhaseKanban(ts){
  var out='<div class="phase-scroll">';
  for(var ph=1;ph<=4;ph++){
    var pDays=[]; for(var k=0;k<DAYS.length;k++) if(DAYS[k].p===ph) pDays.push(DAYS[k]);
    if(!pDays.length) continue;
    var start=pDays[0].d, end=pDays[pDays.length-1].d;
    var isPast=end<ts, isActive=start<=ts&&end>=ts;
    var cls='pk-card'+(isActive?' pk-active':isPast?' pk-past':'');
    // Collect unique cities
    var cities=[], seen={};
    for(var i=0;i<pDays.length;i++){
      var parts=pDays[i].c.split(' → ');
      for(var j=0;j<parts.length;j++){
        var ct=parts[j].trim();
        if(ct&&!seen[ct]){seen[ct]=true;cities.push(ct);}
      }
    }
    var sd=new Date(start+'T00:00:00'), ed=new Date(end+'T00:00:00');
    var sf=sd.toLocaleDateString('en-AU',{day:'numeric',month:'short'});
    var ef=ed.toLocaleDateString('en-AU',{day:'numeric',month:'short'});
    out+='<div class="'+cls+'" id="pk'+ph+'">';
    out+='<div class="pk-hdr"><div class="pk-dot" style="background:'+PC[ph]+'"></div>';
    out+='<span class="pk-name" style="color:'+PC[ph]+'">'+PN[ph]+'</span></div>';
    out+='<div class="pk-dates">'+sf+' – '+ef+'</div>';
    out+='<div class="pk-cities">';
    for(var i=0;i<cities.length;i++){
      var isCurrent=isActive&&pDays.some(function(d){return d.d===ts&&d.c.indexOf(cities[i])!==-1;});
      out+='<span class="pk-city'+(isCurrent?' pk-city-now':'')+'">'+cities[i]+'</span>';
    }
    out+='</div>';
    out+='<div class="pk-footer">';
    if(isActive) out+='<span class="badge b-ac">Active</span>';
    else if(isPast) out+='<span class="badge b-dim">Done ✓</span>';
    else{ var dLeft=Math.ceil((new Date(start+'T00:00:00')-new Date(ts+'T00:00:00'))/86400000); out+='<span class="badge b-dim">in '+dLeft+'d</span>'; }
    out+='</div></div>';
  }
  out+='</div>';
  return out;
}

/* ─── TIMELINE ───────────────────────────────────────────── */

var WIKIIMG={}, WIKIFETCH={};
var WIKI_MAP={
  Athens:'Athens',Milos:'Milos',Catania:'Catania',Taormina:'Taormina',
  Bristol:'Bristol',Munich:'Munich',Innsbruck:'Innsbruck',Amsterdam:'Amsterdam',
  Porto:'Porto',Ericeira:'Ericeira',Madrid:'Madrid',Barcelona:'Barcelona',
  Ibiza:'Ibiza',Sydney:'Sydney'
};

function photoCity(c){ var p=c.split(' → '); return p[p.length-1]; }
function guideCity(c){
  var p=c.split(' → ');
  for(var i=p.length-1;i>=0;i--) if(GUIDES[p[i]]) return p[i];
  return null;
}
function jumpPhase(ph){
  var el=g('ph'+ph), main=g('main');
  if(!el||!main) return;
  var r=el.getBoundingClientRect(), mr=main.getBoundingClientRect();
  main.scrollBy({top:r.top-mr.top-52, behavior:'smooth'});
}
function goGuide(city){
  selCity(city);
  var btn=document.querySelector('.nbtn[data-icon="ph-compass"]');
  if(btn) go('Cities',btn);
}
function toggleDay(i){
  var card=g('dc'+i); if(!card) return;
  var body=card.querySelector('.day-body');
  var inner=card.querySelector('.day-body-inner');
  if(card.classList.contains('open')){
    body.style.height=body.scrollHeight+'px';
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){ body.style.height='0'; });
    });
    card.classList.remove('open');
  } else {
    card.classList.add('open');
    body.style.height=inner.scrollHeight+'px';
    body.addEventListener('transitionend',function h(){ body.style.height='auto'; body.removeEventListener('transitionend',h); });
  }
}
function loadTimelinePhotos(){
  var imgs=document.querySelectorAll('#pTimeline .day-thumb img[data-city]');
  var needed={};
  for(var i=0;i<imgs.length;i++){
    var c=imgs[i].getAttribute('data-city');
    if(c&&WIKI_MAP[c]&&!WIKIIMG[c]) needed[c]=true;
  }
  Object.keys(needed).forEach(function(city){
    if(WIKIFETCH[city]) return;
    WIKIFETCH[city]=true;
    fetch('https://en.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(WIKI_MAP[city]))
      .then(function(r){return r.json();})
      .then(function(data){
        var url=data.thumbnail&&data.thumbnail.source;
        if(!url) return;
        // Filter coats-of-arms, flags, locator maps — check full URL path not just filename
        if(/(coat_of_arms|locator_map|location_map|flag_of|Flag_of|administrative_map)/i.test(url)) return;
        if(url.indexOf('/thumb/')>-1) url=url.replace(/\/\d+px-[^/]*$/,'/640px-'+url.split('/').pop());
        WIKIIMG[city]=url;
        var els=document.querySelectorAll('#pTimeline .day-thumb img[data-city="'+city+'"]');
        for(var j=0;j<els.length;j++) els[j].src=url;
      }).catch(function(){});
  });
}

function renderTimeline(){
  var ts=TODAY.toISOString().split('T')[0];
  // Find first upcoming day to auto-open (only if not on trip)
  var hasToday=false;
  for(var k=0;k<DAYS.length;k++) if(DAYS[k].d===ts){ hasToday=true; break; }
  var firstUp=-1;
  if(!hasToday) for(var k=0;k<DAYS.length;k++) if(DAYS[k].d>=ts){ firstUp=k; break; }

  var out='';

  // Route map panel (collapsible, open by default)
  out+='<div class="map-panel">';
  out+='<div class="map-toggle" onclick="toggleMap()">';
  out+='<div class="row gap2"><i class="ph-fill ph-map-pin" style="color:var(--ac);font-size:16px"></i><span class="label">Route map</span><span class="cap" style="margin-left:4px">15 cities · Europe</span></div>';
  out+='<i class="ph ph-caret-down map-caret-icon open" id="mapCaret"></i>';
  out+='</div>';
  out+='<div id="mapWrap" style="height:260px;overflow:hidden;transition:height .3s ease"><div id="routeMap"></div></div>';
  out+='</div>';

  // Sticky phase jump tabs
  out+='<div class="tl-tabs">';
  for(var p=1;p<=4;p++) out+='<button class="tl-tab" onclick="jumpPhase('+p+')"><span class="tl-tab-dot" style="background:'+PC[p]+'"></span>'+PN[p]+'</button>';
  out+='</div>';

  var lp=0;
  for(var i=0;i<DAYS.length;i++){
    var d=DAYS[i];
    var isToday=d.d===ts, isPast=d.d<ts;
    var isOpen=isToday||(i===firstUp);
    var dn=dayNum(d.d);
    var pc=photoCity(d.c);
    var gc=guideCity(d.c);
    var bg=HERO_BG[pc]||HERO_BG[d.c]||'135deg,#444,#222';

    if(d.p!==lp){
      lp=d.p;
      out+='<div class="phase-hdr" id="ph'+d.p+'">';
      out+='<div class="phase-dot" style="background:'+PC[d.p]+'"></div>';
      out+='<span class="phase-label" style="color:'+PC[d.p]+'">'+PN[d.p]+'</span>';
      out+='</div>';
    }

    out+='<div class="day-wrap"><div class="day-card'+(isToday?' today':'')+(isPast?' past':'')+(isOpen?' open':'')+'" id="dc'+i+'">';

    // ── Tap header ──
    out+='<div class="day-tog" onclick="toggleDay('+i+')">';
    out+='<div class="day-thumb"><div class="day-thumb-bg" style="background:linear-gradient('+bg+')"></div><div class="day-thumb-em">'+d.e+'</div><img data-city="'+pc+'" alt="" onload="this.classList.add(\'vis\')"></div>';
    out+='<div class="day-tog-meta">';
    out+='<div class="day-tog-city'+(isToday?' ac':'')+'">'+d.c+'</div>';
    out+='<div class="day-tog-date">'+fmt(d.d)+'&nbsp;·&nbsp;Day '+dn+'</div>';
    if(isToday)          out+='<div class="day-tog-badge"><span class="badge b-ac">Today</span></div>';
    else if(d.t==='event') out+='<div class="day-tog-badge"><span class="badge b-ac"><i class="ph-fill ph-lock-simple"></i>Locked</span></div>';
    else if(d.a&&d.r)    out+='<div class="day-tog-badge"><span class="badge b-ok"><i class="ph-fill ph-check-circle"></i>Booked</span></div>';
    else if(d.a&&!d.r)   out+='<div class="day-tog-badge"><span class="badge b-warn">Unconfirmed</span></div>';
    else if(!d.a&&d.t!=='travel'&&d.t!=='home') out+='<div class="day-tog-badge"><span class="badge b-warn">Book accomm.</span></div>';
    out+='</div>';
    out+='<i class="ph ph-caret-down day-caret"></i>';
    out+='</div>';

    // ── Expandable body ──
    out+='<div class="day-body"'+(isOpen?' style="height:auto"':'')+'>';
    out+='<div class="day-body-inner">';

    if(d.a){
      var ok=!!d.r;
      out+='<div class="list-row"><div class="ico '+(ok?'ico-ok':'')+'"><i class="'+(ok?'ph-fill':'ph')+' ph-bed"></i></div>';
      out+='<div class="grow1"><div class="cap">Tonight</div><div class="title">'+d.a+'</div>';
      out+=(ok?'<div class="cap mt1 ok-tx">'+d.r+'</div>':'<div class="cap mt1 warn-tx">Confirm booking</div>');
      out+='</div></div>';
    }
    if(d.bk&&BK[d.bk]){
      var b=BK[d.bk];
      out+='<div class="day-flt"><div class="day-flt-route"><span class="day-flt-code">'+b.from+'</span><i class="ph-fill ph-airplane-in-flight day-flt-arrow"></i><span class="day-flt-code">'+b.to+'</span></div>';
      out+='<div class="day-flt-meta">'+b.fl+' · '+b.dep+'–'+b.arr+' · Seat '+b.seat+' · €'+b.eur+'</div></div>';
    }
    if(d.th&&d.th.length){
      out+='<div class="label" style="margin:'+(d.a||d.bk?'12px':'0')+'px 0 6px">Plan</div>';
      for(var j=0;j<d.th.length;j++) out+='<div class="day-hl">'+d.th[j].replace('🔒 ','')+'</div>';
    }
    if(gc) out+='<button class="cta-sm" onclick="event.stopPropagation();goGuide(\''+gc+'\')"><i class="ph ph-compass"></i>'+gc+' guide</button>';

    out+='</div></div></div></div>'; // body-inner, day-body, day-card, day-wrap
  }

  g('pTimeline').innerHTML=out;
  loadTimelinePhotos();
}

  out+='<div class="card card-ac mb5">';
  out+='<div class="row between mb3"><span class="title accent">Non-negotiables</span><span class="title accent">'+done+' / '+GOALS.length+'</span></div>';
  out+='<div class="prog-rail" style="height:5px"><div class="prog-bar" style="width:'+Math.round(done/GOALS.length*100)+'%;height:100%"></div></div>';
  out+='</div>';

  var cats=['Travel','Fitness','Photography','Design'];
  var catIcons={Travel:'ph-airplane',Fitness:'ph-barbell',Photography:'ph-aperture',Design:'ph-ruler'};
  for(var c=0;c<cats.length;c++){
    var cat=cats[c];
    var catDone=0;
    for(var i=0;i<GOALS.length;i++) if(GOALS[i].cat===cat&&gs[GOALS[i].id]) catDone++;
    var catTotal=0;
    for(var i=0;i<GOALS.length;i++) if(GOALS[i].cat===cat) catTotal++;

    out+='<div class="goal-cat-hdr"><div class="row between">';
    out+='<div class="row gap2"><i class="ph '+catIcons[cat]+'" style="color:var(--tx3)"></i>'+cat+'</div>';
    out+='<span>'+catDone+' / '+catTotal+'</span>';
    out+='</div></div>';

    for(var i=0;i<GOALS.length;i++){
      var go=GOALS[i]; if(go.cat!==cat) continue;
      var on=!!gs[go.id];
      out+='<div class="goal-item" onclick="tog(\''+go.id+'\')">'+
             '<div class="goal-chk'+(on?' on':'')+'"></div>'+
             '<div class="goal-lbl'+(on?' done':'')+'">'+go.l+'</div>'+
             (go.locked?'<span class="goal-locked"><i class="ph-fill ph-lock-simple"></i> Locked</span>':'')+
           '</div>';
    }
  }
  out+='</div>';
  g('pGoals').innerHTML=out;
}

function tog(id){
  var wasOff=!gs[id];
  gs[id]=!gs[id];
  localStorage.setItem('lk_g',JSON.stringify(gs));
  if(wasOff){
    // Celebration burst — float a ✓ upward from the tapped row
    var row=document.querySelector('[onclick*="tog(\''+id+'\')"]');
    if(row){
      var r=row.getBoundingClientRect();
      var b=document.createElement('span');
      b.textContent='✓';
      b.style.cssText='position:fixed;left:'+(r.left+24)+'px;top:'+r.top+'px;'
        +'font-size:24px;font-weight:900;color:#F26419;pointer-events:none;z-index:9999;'
        +'transition:transform .5s ease,opacity .5s ease;opacity:1;transform:translateY(0) scale(1)';
      document.body.appendChild(b);
      requestAnimationFrame(function(){
        requestAnimationFrame(function(){
          b.style.opacity='0'; b.style.transform='translateY(-52px) scale(1.6)';
        });
      });
      setTimeout(function(){ if(b.parentNode) b.parentNode.removeChild(b); },520);
    }
  }
  renderGoals(); renderToday();
}

/* ─── BUDGET ─────────────────────────────────────────────── */
function renderBudget(){
  // Compute logged totals per category
  var loggedByCat={}, loggedTotal=0;
  for(var i=0;i<exps.length;i++){
    loggedByCat[exps[i].cat]=(loggedByCat[exps[i].cat]||0)+exps[i].amt;
    loggedTotal+=exps[i].amt;
  }
  var tB=0,tA=0;
  for(var i=0;i<BCATS.length;i++){
    tB+=parseFloat(bs[BCATS[i]+'_b']||0);
    tA+=parseFloat(bs[BCATS[i]+'_a']||0)+(loggedByCat[BCATS[i]]||0);
  }
  var over=tA>tB&&tB>0;
  var out='<div class="px pt5">';

  // Hero tiles
  out+='<div class="budget-hero">';
  out+='<div class="budget-tile"><div class="budget-tile-label">Budget</div><div class="budget-tile-num accent" id="tB">A$'+Math.round(tB).toLocaleString()+'</div></div>';
  out+='<div class="budget-tile"><div class="budget-tile-label">Logged</div><div class="budget-tile-num'+(over?' over':'')+'" id="tA">€'+loggedTotal.toFixed(2)+'</div></div>';
  out+='</div>';

  // Confirmed costs
  out+='<div class="label mb3">Confirmed from bookings</div>';
  out+='<div class="card card-ok mb4">';
  out+='<div class="list-row"><div class="ico ico-ok"><i class="ph-fill ph-airplane"></i></div><div class="grow1"><div class="title">BCN → IBZ · Vueling</div><div class="cap mt1">Mon 13 Jul · VY3518</div></div><span class="accent" style="font-weight:700">€65.99</span></div>';
  out+='<div class="list-row"><div class="ico ico-ok"><i class="ph-fill ph-airplane"></i></div><div class="grow1"><div class="title">IBZ → BCN · Vueling</div><div class="cap mt1">Wed 15 Jul · VY3511</div></div><span class="accent" style="font-weight:700">€102.99</span></div>';
  out+='<div class="list-row"><div class="ico ico-ok"><i class="ph-fill ph-bed"></i></div><div class="grow1"><div class="title">Wombat\'s Munich</div><div class="cap mt1">24 Jun · €9.56 + €56.41 at property</div></div><span class="accent" style="font-weight:700">€64.10</span></div>';
  out+='</div>';

  // Category rows
  out+='<div class="budget-cat-hdr">';
  out+='<div style="flex:1" class="budget-cat-hdr-label">Category</div>';
  out+='<div style="width:72px;text-align:right" class="budget-cat-hdr-label">Budget A$</div>';
  out+='<div style="width:64px;text-align:right" class="budget-cat-hdr-label">Logged €</div>';
  out+='</div>';

  for(var i=0;i<BCATS.length;i++){
    var cat=BCATS[i];
    var logged=(loggedByCat[cat]||0);
    out+='<div class="budget-row">';
    out+='<div class="ico"><i class="ph '+(BICONS[cat]||'ph-tag')+'"></i></div>';
    out+='<div class="budget-row-name">'+cat+'</div>';
    out+='<input class="binp" type="number" inputmode="numeric" placeholder="0" value="'+(bs[cat+'_b']||'')+'" oninput="savB(\''+cat+'\',\'b\',this.value)">';
    out+='<div class="binp actual" style="display:flex;align-items:center;justify-content:flex-end;cursor:default">'
      +(logged>0?'<span style="font-weight:700">'+logged.toFixed(0)+'</span>':'<span style="color:var(--tx3)">—</span>')+'</div>';
    out+='</div>';
  }

  // Expense log
  if(exps.length>0){
    out+='<div class="label mt5 mb3">Recent expenses</div>';
    out+='<div class="card mb5">';
    var recent=exps.slice().reverse().slice(0,15);
    for(var i=0;i<recent.length;i++){
      var idx=exps.length-1-i;
      var ex=recent[i];
      out+='<div class="exp-log-row">'
        +'<div class="ico" style="width:30px;height:30px"><i class="ph '+(BICONS[ex.cat]||'ph-tag')+'" style="font-size:13px"></i></div>'
        +'<div class="exp-log-left"><div class="exp-log-cat">'+ex.cat+(ex.note?' · '+ex.note:'')+'</div>'
        +'<div class="exp-log-date">'+fmt(ex.d)+'</div></div>'
        +'<span class="exp-log-amt">€'+ex.amt.toFixed(2)+'</span>'
        +'<button onclick="deleteExp('+idx+')" style="color:var(--tx3);padding:4px 8px;font-size:13px">×</button>'
        +'</div>';
    }
    out+='<div class="row between" style="padding:var(--sp3) 0 0;border-top:1px solid var(--bd)">';
    out+='<span class="label">Total logged</span><span class="title accent">€'+loggedTotal.toFixed(2)+'</span></div>';
    out+='</div>';
  }

  out+='</div>';
  g('pBudget').innerHTML=out;
}

function savB(cat,f,v){
  bs[cat+'_'+f]=v;
  localStorage.setItem('lk_b',JSON.stringify(bs));
  var tB=0,tA=0;
  for(var i=0;i<BCATS.length;i++){
    tB+=parseFloat(bs[BCATS[i]+'_b']||0);
    tA+=parseFloat(bs[BCATS[i]+'_a']||0);
  }
  var b=g('tB'),a=g('tA');
  if(b) b.textContent='A$'+Math.round(tB).toLocaleString();
  if(a){
    a.textContent='A$'+Math.round(tA).toLocaleString();
    a.className='budget-tile-num'+(tA>tB&&tB>0?' over':'');
  }
}

/* ─── Navigation ─────────────────────────────────────────── */
function go(name,btn){
  var panes=document.querySelectorAll('.pane');
  for(var i=0;i<panes.length;i++) panes[i].classList.remove('on');
  var nbtns=document.querySelectorAll('.nbtn');
  for(var i=0;i<nbtns.length;i++){
    var nb=nbtns[i];
    nb.classList.remove('on');
    var ic=nb.querySelector('i');
    if(ic) ic.className='ph '+nb.getAttribute('data-icon');
  }
  g('p'+name).classList.add('on');
  btn.classList.add('on');
  var activeIcon=btn.querySelector('i');
  if(activeIcon) activeIcon.className='ph-fill '+btn.getAttribute('data-icon');
  try{ g('main').scrollTo({top:0,behavior:'instant'}); }catch(e){}
  if(name==='Timeline') setTimeout(initRouteMap,120);
  // FAB visible on Today + Budget only
  var fab=g('fab');
  if(fab) fab.classList.toggle('hidden', name!=='Today'&&name!=='Budget');
}

/* ─── Theme ──────────────────────────────────────────────── */
function applyTheme(){
  document.body.classList.toggle('light',!dark);
  g('themeColor').content = dark ? '#0d0d0d' : '#f4f2ef';
  var tb=g('themeBtn');
  if(tb) tb.querySelector('i').className = dark ? 'ph ph-moon' : 'ph ph-sun';
}
function toggleTheme(){
  dark=!dark;
  localStorage.setItem('lk_t',dark?'dark':'light');
  applyTheme();
}

function openSheet(){ g('installOvl').classList.add('on'); document.body.style.overflow='hidden'; }
function closeSheet(){ g('installOvl').classList.remove('on'); document.body.style.overflow=''; }

try {
  boot();
} catch(e) {
  var ep = g('pToday');
  if(ep) ep.innerHTML = '<div style="padding:24px 16px;color:#f87171">'
    +'<div style="font-size:17px;font-weight:700;margin-bottom:8px">App error</div>'
    +'<div style="font-size:13px;opacity:.8;word-break:break-all">'+(e.message||String(e))+'</div>'
    +'<div style="font-size:11px;margin-top:12px;opacity:.5">'+((e.stack||'').split('\n')[1]||'')+'</div>'
    +'</div>';
}
</script>
