<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Luke Europe">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d0d0d" id="themeColor">
<title>Luke's Europe 2026</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/regular/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/fill/style.css">
<style>
/* ─── Design tokens ─────────────────────────────────────── */
:root {
  --font: -apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif;

  /* Dark mode (default) */
  --bg:   #0d0d0d;
  --s1:   #181818;
  --s2:   #222;
  --s3:   #2d2d2d;
  --tx:   #f0ede8;
  --tx2:  #888;
  --tx3:  #484848;
  --bd:   rgba(255,255,255,.07);
  --bd2:  rgba(255,255,255,.13);

  --ac:      #F26419;
  --ac-dim:  rgba(242,100,25,.13);
  --ac-tx:   #F58A50;
  --ok:      #4ade80;
  --ok-dim:  rgba(74,222,128,.12);
  --ok-tx:   #4ade80;
  --warn:    #fbbf24;
  --warn-dim:rgba(251,191,36,.12);
  --warn-tx: #fbbf24;
  --err:     #f87171;

  /* Phase colours */
  --p1:#E07B5A; --p2:#4A9E7A; --p3:#E8A23C; --p4:#5A7EC4;

  /* Spacing */
  --sp1:4px; --sp2:8px; --sp3:12px; --sp4:16px;
  --sp5:20px; --sp6:24px; --sp8:32px;

  /* Radius */
  --r-sm:10px; --r-md:16px; --r-lg:22px; --r-xl:28px; --r-full:999px;

  /* Spring easing */
  --spring: linear(
    0, 0.009, 0.035 2.1%, 0.141 4.4%, 0.723 12.4%,
    0.938 16%, 1.017, 1.06, 1.076 22.3%, 1.07 24%,
    1.013 27.3%, 0.992 29.2%, 0.977 31.5%, 0.975 33%,
    0.984 36.8%, 1.001 40%, 1.006 43.3%, 1 50%
  );
}

body.light {
  --bg:  #f4f2ef;
  --s1:  #ffffff;
  --s2:  #edeae5;
  --s3:  #e0dbd4;
  --tx:  #141210;
  --tx2: #5C574F;
  --tx3: #9C968C;
  --bd:  rgba(0,0,0,.08);
  --bd2: rgba(0,0,0,.15);
}

/* ─── Reset ─────────────────────────────────────────────── */
*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
html { -webkit-text-size-adjust:100%; }
* { -webkit-tap-highlight-color:transparent; }
::-webkit-scrollbar { display:none; }
* { scrollbar-width:none; }
button,input { font-family:var(--font); }
button { cursor:pointer; border:none; background:none; color:inherit; }

/* ─── Base ───────────────────────────────────────────────── */
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--tx);
  max-width: 430px;
  margin: 0 auto;
  min-height: 100vh;
  min-height: 100dvh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  transition: background .3s, color .3s;
}

#app { display:flex; flex-direction:column; height:100vh; height:100dvh; }
#main {
  flex:1; overflow-y:auto; overscroll-behavior:contain;
  padding-bottom: calc(env(safe-area-inset-bottom,0px) + 68px);
}

/* ─── Panes ──────────────────────────────────────────────── */
.pane { display:none; }
.pane.on { display:block; }

/* ─── Bottom Nav ─────────────────────────────────────────── */
#nav {
  position:fixed; bottom:0; left:50%; transform:translateX(-50%);
  width:100%; max-width:430px;
  background: rgba(13,13,13,.88);
  backdrop-filter: blur(24px) saturate(200%);
  -webkit-backdrop-filter: blur(24px) saturate(200%);
  border-top: 1px solid var(--bd);
  padding-bottom: env(safe-area-inset-bottom,0);
  z-index:100; display:flex;
  transition: background .3s;
}
body.light #nav { background: rgba(244,242,239,.9); }

.nbtn {
  flex:1; display:flex; flex-direction:column; align-items:center;
  justify-content:center; gap:3px;
  padding:10px 0 11px;
  color:var(--tx3); font-size:9px; font-weight:700;
  letter-spacing:.07em; text-transform:uppercase;
  transition: color .2s, transform .4s var(--spring);
}
.nbtn:active { transform:scale(.86); }
.nbtn.on { color:var(--ac); }
.nbtn i { font-size:21px; line-height:1; }

/* ─── Typography ─────────────────────────────────────────── */
.label {
  font-size:10px; font-weight:700; letter-spacing:.1em;
  text-transform:uppercase; color:var(--tx3);
}
.cap   { font-size:12px; font-weight:500; color:var(--tx2); }
.body  { font-size:15px; line-height:1.5; }
.title { font-size:17px; font-weight:600; line-height:1.3; letter-spacing:-.01em; }
.head  { font-size:22px; font-weight:700; line-height:1.2; letter-spacing:-.02em; }

.muted  { color:var(--tx2); }
.dim    { color:var(--tx3); }
.accent { color:var(--ac); }
.ok-tx  { color:var(--ok); }
.warn-tx{ color:var(--warn); }

/* ─── Spacing helpers ────────────────────────────────────── */
.px { padding-left:var(--sp4); padding-right:var(--sp4); }
.mt2{margin-top:var(--sp2)} .mt3{margin-top:var(--sp3)} .mt4{margin-top:var(--sp4)}
.mt5{margin-top:var(--sp5)} .mt6{margin-top:var(--sp6)} .mt8{margin-top:var(--sp8)}
.mb2{margin-bottom:var(--sp2)} .mb3{margin-bottom:var(--sp3)} .mb4{margin-bottom:var(--sp4)}
.mb5{margin-bottom:var(--sp5)} .mb6{margin-bottom:var(--sp6)}
.pt4{padding-top:var(--sp4)} .pt5{padding-top:var(--sp5)} .pt6{padding-top:var(--sp6)}
.pb4{padding-bottom:var(--sp4)}

/* ─── Layout ─────────────────────────────────────────────── */
.row    { display:flex; align-items:center; gap:var(--sp3); }
.col    { display:flex; flex-direction:column; }
.between{ justify-content:space-between; }
.wrap   { flex-wrap:wrap; }
.grow1  { flex:1; }
.gap2   { gap:var(--sp2); }
.gap3   { gap:var(--sp3); }

/* ─── Cards ──────────────────────────────────────────────── */
.card {
  background:var(--s1); border-radius:var(--r-lg);
  padding:var(--sp4);
  border:1px solid var(--bd);
  transition: background .3s, border-color .3s;
}
.card-ac { background:var(--ac-dim)!important; border-color:rgba(242,100,25,.25)!important; }
.card-ok { background:var(--ok-dim)!important; border-color:rgba(74,222,128,.2)!important; }
.card-wn { background:var(--warn-dim)!important; border-color:rgba(251,191,36,.2)!important; }

/* ─── Badges ─────────────────────────────────────────────── */
.badge {
  display:inline-flex; align-items:center; gap:4px;
  font-size:11px; font-weight:700; letter-spacing:.02em;
  padding:3px 8px; border-radius:var(--r-full);
  white-space:nowrap;
}
.b-ok   { background:var(--ok-dim);   color:var(--ok);   border:1px solid rgba(74,222,128,.2); }
.b-warn { background:var(--warn-dim); color:var(--warn); border:1px solid rgba(251,191,36,.2); }
.b-ac   { background:var(--ac-dim);   color:var(--ac);   border:1px solid rgba(242,100,25,.25); }
.b-dim  { background:var(--s2);       color:var(--tx2);  border:1px solid var(--bd); }

/* ─── Icon container ─────────────────────────────────────── */
.ico {
  width:40px; height:40px; border-radius:var(--r-sm);
  background:var(--s2); border:1px solid var(--bd);
  display:flex; align-items:center; justify-content:center;
  font-size:18px; flex-shrink:0;
  transition: background .3s;
}
.ico-ac { background:var(--ac-dim)!important; border-color:rgba(242,100,25,.2)!important; }
.ico-ok { background:var(--ok-dim)!important; border-color:rgba(74,222,128,.15)!important; }
.ico i  { font-size:18px; }

/* ─── List rows ──────────────────────────────────────────── */
.list-row {
  display:flex; align-items:center; gap:var(--sp3);
  padding:var(--sp3) 0;
  border-bottom:1px solid var(--bd);
  min-height:52px;
}
.list-row:last-child { border-bottom:none; }

/* ─── Progress bar ───────────────────────────────────────── */
.prog-rail { height:4px; background:var(--s3); border-radius:var(--r-full); overflow:hidden; }
.prog-bar  { height:100%; background:var(--ac); border-radius:var(--r-full); transition:width .6s ease; }

/* ─── TODAY — Hero ───────────────────────────────────────── */
.today-util {
  display:flex; justify-content:flex-end; gap:var(--sp2);
  padding: calc(env(safe-area-inset-top,0px) + 10px) var(--sp4) 0;
}
.util-btn {
  width:36px; height:36px; border-radius:var(--r-full);
  background:var(--s2); border:1px solid var(--bd);
  display:flex; align-items:center; justify-content:center;
  color:var(--tx2); font-size:16px;
  transition: background .2s, transform .3s var(--spring);
}
.util-btn:active { transform:scale(.88); }
.util-btn i { font-size:17px; }

.today-hero {
  padding: var(--sp6) var(--sp4) var(--sp4);
  min-height:220px;
  display:flex; flex-direction:column; justify-content:flex-end;
}
.hero-eyebrow {
  font-size:11px; font-weight:700; letter-spacing:.12em;
  text-transform:uppercase; color:var(--tx3);
  margin-bottom:var(--sp2);
}
.hero-display {
  font-size: clamp(64px, 17vw, 96px);
  font-weight:900; letter-spacing:-.04em; line-height:.9;
  color:var(--ac);
  text-shadow:
    0 2px 0 rgba(0,0,0,.3),
    0 6px 20px rgba(242,100,25,.25);
}
body.light .hero-display {
  text-shadow:
    0 2px 0 rgba(0,0,0,.1),
    0 6px 20px rgba(242,100,25,.2);
}
.hero-sub {
  font-size:17px; font-weight:500; color:var(--tx2);
  margin-top:var(--sp3); letter-spacing:-.01em;
}

/* ─── TODAY — Sections ───────────────────────────────────── */
.sec-hdr {
  display:flex; align-items:center; justify-content:space-between;
  margin-bottom:var(--sp3);
}
.sec-action {
  font-size:12px; font-weight:600; color:var(--ac);
  letter-spacing:.01em;
}

/* Flight card */
.flt-card {
  background:var(--s1); border:1px solid var(--bd);
  border-radius:var(--r-lg); padding:var(--sp4);
  transition:background .3s;
}
.flt-route {
  display:flex; align-items:center; justify-content:space-between;
  margin-bottom:var(--sp3);
}
.flt-code { font-size:26px; font-weight:800; letter-spacing:-.03em; }
.flt-arrow { color:var(--ac); font-size:20px; }
.flt-meta { font-size:13px; color:var(--tx2); font-weight:500; }

/* ─── TIMELINE ───────────────────────────────────────────── */
.phase-hdr {
  display:flex; align-items:center; gap:var(--sp2);
  padding:var(--sp6) var(--sp4) var(--sp3);
}
.phase-dot {
  width:8px; height:8px; border-radius:var(--r-full); flex-shrink:0;
}
.phase-label {
  font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase;
}

.day-wrap { padding:0 var(--sp4) var(--sp3); }
.day-card {
  background:var(--s1); border-radius:var(--r-lg);
  border:1px solid var(--bd); overflow:hidden;
  transition:background .3s, transform .4s var(--spring);
}
.day-card:active { transform:scale(.99); }
.day-card.today { border-color:rgba(242,100,25,.35); }

.day-hdr {
  display:flex; align-items:center; justify-content:space-between;
  padding:var(--sp3) var(--sp4);
  border-bottom:1px solid var(--bd);
  background:var(--s2);
  transition:background .3s;
}
.day-hdr.today { background:var(--ac-dim); border-color:rgba(242,100,25,.2); }
.day-date { font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--tx3); }
.day-date.today { color:var(--ac); }
.day-num  { font-size:11px; font-weight:700; color:var(--tx3); }
.day-num.today { color:var(--ac); }

.day-body { padding:var(--sp3) var(--sp4); }
.day-city {
  font-size:17px; font-weight:700; letter-spacing:-.02em;
  color:var(--tx); margin-bottom:var(--sp2);
  display:flex; align-items:center; gap:var(--sp2);
}
.day-city.today { color:var(--ac); }
.day-city-em { font-size:18px; }

.day-badges { display:flex; flex-wrap:wrap; gap:var(--sp2); margin-bottom:var(--sp3); }

.day-hl {
  display:flex; align-items:flex-start; gap:var(--sp2);
  padding:3px 0; font-size:13px; color:var(--tx2); line-height:1.5;
}
.day-hl::before {
  content:''; width:4px; height:4px; border-radius:var(--r-full);
  background:var(--tx3); flex-shrink:0; margin-top:6px;
}

/* Flight inline */
.day-flt {
  background:var(--ac-dim); border:1px solid rgba(242,100,25,.2);
  border-radius:var(--r-md); padding:var(--sp3) var(--sp4);
  margin-bottom:var(--sp3);
}
.day-flt-route {
  display:flex; align-items:center; justify-content:space-between;
  margin-bottom:var(--sp2);
}
.day-flt-code { font-size:20px; font-weight:800; letter-spacing:-.02em; }
.day-flt-arrow { color:var(--ac); }
.day-flt-meta  { font-size:12px; color:var(--tx2); font-weight:500; }

/* ─── CITIES ─────────────────────────────────────────────── */
.city-scroll {
  display:flex; gap:var(--sp2);
  padding:var(--sp4) var(--sp4) 0;
  overflow-x:auto;
}
.city-chip {
  white-space:nowrap; padding:7px var(--sp4);
  border-radius:var(--r-full);
  border:1px solid var(--bd);
  background:var(--s2); font-size:13px; font-weight:600;
  color:var(--tx2); min-height:36px;
  transition: background .2s, color .2s, border-color .2s, transform .3s var(--spring);
}
.city-chip:active { transform:scale(.94); }
.city-chip.on {
  background:var(--ac); border-color:var(--ac); color:#fff;
}

.city-hero {
  position:relative; height:200px; overflow:hidden;
  margin-top:var(--sp4);
}
.city-hero-bg {
  position:absolute; inset:0;
}
.city-hero-grad {
  position:absolute; inset:0;
  background:linear-gradient(to top, rgba(0,0,0,.82) 0%, rgba(0,0,0,.2) 55%, transparent 100%);
}
.city-hero-em {
  position:absolute; inset:0; display:flex; align-items:center;
  justify-content:center; font-size:72px; opacity:.2; pointer-events:none;
}
.city-hero-txt {
  position:absolute; bottom:0; left:0; right:0; padding:var(--sp4);
}
.city-hero-name {
  font-size:32px; font-weight:800; letter-spacing:-.03em;
  color:#fff; line-height:1;
}
.city-hero-sub {
  font-size:13px; color:rgba(255,255,255,.65); margin-top:4px; font-weight:500;
}

.guide-sec { margin-bottom:var(--sp6); }
.guide-hdr {
  display:flex; align-items:center; gap:var(--sp2);
  margin-bottom:var(--sp3);
}
.guide-hdr-icon {
  width:28px; height:28px; border-radius:var(--r-sm);
  background:var(--ac-dim); border:1px solid rgba(242,100,25,.2);
  display:flex; align-items:center; justify-content:center;
  flex-shrink:0;
}
.guide-hdr-icon i { font-size:14px; color:var(--ac); }
.guide-hdr-label {
  font-size:13px; font-weight:700; letter-spacing:.02em; color:var(--tx);
}

.guide-item {
  display:flex; align-items:flex-start; gap:var(--sp2);
  padding:var(--sp2) 0; border-bottom:1px solid var(--bd);
  font-size:14px; color:var(--tx2); line-height:1.55;
}
.guide-item:last-child { border-bottom:none; }
.guide-item::before {
  content:''; width:4px; height:4px; border-radius:var(--r-full);
  background:var(--ac); opacity:.6; flex-shrink:0; margin-top:7px;
}

.review-card {
  background:var(--s2); border:1px solid var(--bd);
  border-radius:var(--r-md); padding:var(--sp3) var(--sp4);
  margin-bottom:var(--sp3); transition:background .3s;
}
.review-place { font-size:14px; font-weight:700; color:var(--tx); }
.review-rating { font-size:12px; font-weight:700; color:var(--ac); }
.review-txt { font-size:13px; color:var(--tx2); line-height:1.6; margin-top:4px; }
.stars { letter-spacing:.05em; }

/* ─── GOALS ──────────────────────────────────────────────── */
.goal-cat-hdr {
  font-size:11px; font-weight:700; letter-spacing:.1em;
  text-transform:uppercase; color:var(--tx3);
  padding: var(--sp5) 0 var(--sp3);
  border-bottom:1px solid var(--bd);
  margin-bottom:2px;
}

.goal-item {
  display:flex; align-items:center; gap:var(--sp3);
  padding:var(--sp3) 0; border-bottom:1px solid var(--bd);
  min-height:52px; cursor:pointer;
  -webkit-user-select:none; user-select:none;
  transition: opacity .2s;
}
.goal-item:last-child { border-bottom:none; }
.goal-item:active { opacity:.7; }

.goal-chk {
  width:24px; height:24px; border-radius:8px;
  border:2px solid var(--bd2); flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  transition: background .2s, border-color .2s, transform .5s var(--spring);
}
.goal-chk.on {
  background:var(--ac); border-color:var(--ac);
  transform:scale(1.08);
}
.goal-chk.on::after {
  content:''; width:10px; height:6px;
  border-left:2px solid #fff; border-bottom:2px solid #fff;
  transform:rotate(-45deg) translateY(-1px); display:block;
}
.goal-lbl {
  flex:1; font-size:15px; font-weight:500; line-height:1.35;
  transition:color .2s;
}
.goal-lbl.done { color:var(--tx3); text-decoration:line-through; }
.goal-locked {
  font-size:10px; font-weight:700; letter-spacing:.06em;
  text-transform:uppercase; color:var(--ac); flex-shrink:0;
}

/* ─── BUDGET ─────────────────────────────────────────────── */
.budget-hero {
  display:grid; grid-template-columns:1fr 1fr; gap:var(--sp3);
  margin-bottom:var(--sp5);
}
.budget-tile {
  background:var(--s1); border:1px solid var(--bd);
  border-radius:var(--r-lg); padding:var(--sp4);
  transition:background .3s;
}
.budget-tile-label { font-size:10px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--tx3); margin-bottom:var(--sp2); }
.budget-tile-num {
  font-size:28px; font-weight:800; letter-spacing:-.03em;
  line-height:1; color:var(--tx);
}
.budget-tile-num.accent { color:var(--ac); }
.budget-tile-num.over   { color:var(--err); }

.budget-cat-hdr {
  display:flex; align-items:center; justify-content:space-between;
  padding: var(--sp3) 0; border-bottom:1px solid var(--bd);
  margin-bottom:2px;
}
.budget-cat-hdr-label { font-size:10px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--tx3); }

.budget-row {
  display:flex; align-items:center; gap:var(--sp3);
  padding: var(--sp2) 0; border-bottom:1px solid var(--bd);
  min-height:52px;
}
.budget-row:last-child { border-bottom:none; }

.budget-row-name { flex:1; font-size:14px; font-weight:500; color:var(--tx2); }
.binp {
  width:80px; padding:var(--sp2) var(--sp2);
  background:var(--s2); border:1px solid var(--bd);
  border-radius:var(--r-sm); font-size:13px; font-weight:600;
  color:var(--tx); text-align:right; outline:none;
  font-family:var(--font);
  -webkit-appearance:none;
  transition:border-color .2s;
}
.binp:focus { border-color:var(--ac); }
.binp.actual { border-color:rgba(74,222,128,.25); }

/* ─── INSTALL SHEET ──────────────────────────────────────── */
.ovl {
  position:fixed; inset:0; background:rgba(0,0,0,.6);
  z-index:200; display:flex; align-items:flex-end;
  opacity:0; pointer-events:none;
  transition:opacity .25s;
}
.ovl.on { opacity:1; pointer-events:auto; }
.sheet {
  background:var(--s1); border-radius:var(--r-xl) var(--r-xl) 0 0;
  padding:var(--sp5) var(--sp4) calc(env(safe-area-inset-bottom,0px) + var(--sp6));
  width:100%; max-height:88vh; max-height:88dvh; overflow-y:auto;
  transform:translateY(24px);
  transition:transform .3s var(--spring);
}
.ovl.on .sheet { transform:none; }
.sheet-handle {
  width:36px; height:4px; border-radius:var(--r-full);
  background:var(--bd2); margin:0 auto var(--sp5);
}
.sheet-title { font-size:20px; font-weight:700; text-align:center; margin-bottom:var(--sp2); letter-spacing:-.02em; }
.sheet-sub { font-size:13px; color:var(--tx2); text-align:center; line-height:1.6; margin-bottom:var(--sp4); }

.url-box {
  background:var(--ac-dim); border:1px solid rgba(242,100,25,.25);
  border-radius:var(--r-md); padding:var(--sp3) var(--sp4);
  font-size:12px; font-weight:600; color:var(--ac-tx);

function fmt(s){
  return new Date(s+'T00:00:00').toLocaleDateString('en-AU',{weekday:'short',day:'numeric',month:'short'});
}
function fmtLong(s){
  return new Date(s+'T00:00:00').toLocaleDateString('en-AU',{weekday:'long',day:'numeric',month:'long'});
}
function stars(r){
  var f=Math.round(r); return '★'.repeat(f)+'☆'.repeat(5-f);
}
function dayNum(d){
  return Math.floor((new Date(d+'T00:00:00')-TS)/86400000)+1;
}

function boot(){
  applyTheme();
  g('urlBox').textContent = window.location.href;
  if(!document.querySelector('link[rel="manifest"]')){
    var mf={name:"Luke's Europe 2026",short_name:"Luke Europe",start_url:"./",display:"standalone",
            background_color:"#0d0d0d",theme_color:"#F26419",
            icons:[{src:"data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9C%88%EF%B8%8F%3C/text%3E%3C/svg%3E",sizes:"any",type:"image/svg+xml"}]};
    var ml=document.createElement('link'); ml.rel='manifest';
    ml.href='data:application/json,'+encodeURIComponent(JSON.stringify(mf));
    document.head.appendChild(ml);
  }
  renderToday();
  renderTimeline();
  renderCities();
  renderGoals();
  renderBudget();
}

/* ─── TODAY ─────────────────────────────────────────────── */
function renderToday(){
  var ts  = TODAY.toISOString().split('T')[0];
  var on  = TODAY >= TS && TODAY <= TE;
  var done= 0; for(var i=0;i<GOALS.length;i++) if(gs[GOALS[i].id]) done++;
  var entry=null; for(var i=0;i<DAYS.length;i++) if(DAYS[i].d===ts){entry=DAYS[i];break;}
  var left= Math.ceil((TS-TODAY)/86400000);
  var out ='';

  // Utility bar
  out += '<div class="today-util">';
  out += '<button class="util-btn" onclick="toggleTheme()" id="themeBtn" aria-label="Toggle theme"><i class="ph ph-sun"></i></button>';
  out += '<button class="util-btn" onclick="openSheet()" aria-label="Install app"><i class="ph ph-download-simple"></i></button>';
  out += '</div>';

  // Hero zone
  if(!on && left > 0){
    // Pre-trip countdown
    out += '<div class="today-hero">';
    out += '<div class="hero-eyebrow">Departure in</div>';
    out += '<div class="hero-display">'+left+'</div>';
    out += '<div class="hero-sub">days &nbsp;·&nbsp; Tue 9 June · Sydney → Athens</div>';
    out += '</div>';

    // Trip progress strip
    var pct = 0;
    out += '<div class="px">';
    out += '<div class="card mb4">';
    out += '<div class="row between mb3"><span class="label">Trip progress</span><span class="label accent">0 of 39 days</span></div>';
    out += '<div class="prog-rail"><div class="prog-bar" style="width:0%"></div></div>';
    out += '</div>';

    // First days preview
    out += '<div class="row between mb3"><span class="label">First stops</span></div>';
    for(var i=0;i<4;i++){
      var d=DAYS[i];
      out += '<div class="list-row">';
      out += '<div class="ico"><span style="font-size:18px">'+d.e+'</span></div>';
      out += '<div class="grow1">';
      out += '<div class="cap mb2">'+fmt(d.d)+'</div>';
      out += '<div class="title">'+d.c+'</div>';
      out += '</div>';
      out += '</div>';
    }
    out += '</div>';

  } else if(entry){
    // On trip
    var dn = dayNum(entry.d);
    out += '<div class="today-hero">';
    out += '<div class="hero-eyebrow">Day '+dn+' of 39 &nbsp;·&nbsp; '+fmtLong(entry.d)+'</div>';
    out += '<div class="hero-display">'+entry.c.split(' → ')[0]+'</div>';
    if(entry.c.indexOf(' → ')!==-1){
      out += '<div class="hero-sub">→ '+entry.c.split(' → ')[1]+'</div>';
    }
    out += '</div>';
    out += '<div class="px">';

    // Trip progress
    var pct=Math.round((dn-1)/39*100);
    out += '<div class="card mb4">';
    out += '<div class="row between mb3"><span class="label">Trip progress</span><span class="label accent">Day '+dn+' of 39</span></div>';
    out += '<div class="prog-rail"><div class="prog-bar" style="width:'+pct+'%"></div></div>';
    out += '</div>';

    // Tonight
    if(entry.a){
      var ok=!!entry.r;
      out += '<div class="label mb3">Tonight</div>';
      out += '<div class="card '+(ok?'card-ok':'card-wn')+' mb4">';
      out += '<div class="row">';
      out += '<div class="ico '+(ok?'ico-ok':'')+'"><i class="'+(ok?'ph-fill':'ph')+' ph-bed"></i></div>';
      out += '<div class="grow1">';
      out += '<div class="cap mb1">Accommodation</div>';
      out += '<div class="title">'+entry.a+'</div>';
      if(ok) out += '<div class="cap mt1 ok-tx">'+entry.r+'</div>';
      else   out += '<div class="cap mt1 warn-tx">Confirm booking</div>';
      out += '</div></div></div>';
    }

    // Flight
    if(entry.bk && BK[entry.bk]){
      var b=BK[entry.bk];
      out += '<div class="label mb3">Flight today</div>';
      out += '<div class="flt-card mb4">';
      out += '<div class="flt-route">';
      out += '<span class="flt-code">'+b.from+'</span>';
      out += '<i class="ph-fill ph-airplane-in-flight flt-arrow"></i>';
      out += '<span class="flt-code">'+b.to+'</span>';
      out += '</div>';
      out += '<div class="row gap2 mb3">';
      out += '<span class="badge b-ok"><i class="ph-fill ph-check-circle"></i>Confirmed</span>';
      out += '<span class="badge b-dim">'+b.fl+'</span>';
      out += '<span class="badge b-dim">Seat '+b.seat+'</span>';
      out += '</div>';
      out += '<div class="row between"><span class="cap">Dep '+b.dep+'</span><span class="cap">Arr '+b.arr+'</span><span class="cap accent">€'+b.eur+'</span></div>';
      out += '</div>';
    }

    // Today plan
    if(entry.th && entry.th.length){
      out += '<div class="label mb3">Today</div>';
      out += '<div class="card mb4">';
      for(var i=0;i<entry.th.length;i++){
        var t=entry.th[i];
        var locked=t.indexOf('🔒')===0;
        out += '<div class="list-row">';
        out += '<div class="ico '+(locked?'ico-ac':'')+'"><i class="ph'+(locked?'-fill':'')+' '+(locked?'ph-lock-simple':'ph-caret-right')+'"></i></div>';
        out += '<div class="grow1 body">'+t.replace('🔒 ','')+'</div>';
        out += '</div>';
      }
      out += '</div>';
    }

    out += '</div>';

  } else if(TODAY > TE){
    // Post trip
    out += '<div class="today-hero">';
    out += '<div class="hero-eyebrow">Trip complete</div>';
    out += '<div class="hero-display">🎉</div>';
    out += '<div class="hero-sub">39 days · 13 cities · Europe 2026</div>';
    out += '</div>';
    out += '<div class="px">';
    out += '<div class="card card-ok mb4 row">';
    out += '<div class="ico ico-ok"><i class="ph-fill ph-check-circle"></i></div>';
    out += '<div class="grow1"><div class="title ok-tx">Back in Sydney</div><div class="cap mt1">Trip finished '+fmt('2026-07-17')+'</div></div>';
    out += '</div></div>';
  }

  // Locked events — always show
  out += '<div class="px">';
  out += '<div class="label mb3">Locked in</div>';
  var locked=[{d:'2026-06-23',l:'Hike with Ismael',city:'Innsbruck'},{d:'2026-06-26',l:'Defqon.1',city:'Amsterdam'}];
  out += '<div class="card mb4">';
  for(var i=0;i<locked.length;i++){
    var ev=locked[i];
    var diff=Math.ceil((new Date(ev.d+'T00:00:00')-TODAY)/86400000);
    out += '<div class="list-row">';
    out += '<div class="ico ico-ac"><i class="ph-fill ph-lock-simple accent"></i></div>';
    out += '<div class="grow1">';
    out += '<div class="cap mb1">'+fmt(ev.d)+' · '+ev.city+'</div>';
    out += '<div class="title">'+ev.l+'</div>';
    out += '</div>';
    out += '<div class="badge '+(diff<=0?'b-ok':diff<7?'b-warn':'b-dim')+'">'+(diff<=0?'Today':diff+'d')+'</div>';
    out += '</div>';
  }
  out += '</div>';

  // Goals progress
  out += '<div class="label mb3">Goals</div>';
  out += '<div class="card card-ac mb4">';
  out += '<div class="row between mb3">';
  out += '<span class="title accent">Non-negotiables</span>';
  out += '<span class="title accent">'+done+' / '+GOALS.length+'</span>';
  out += '</div>';
  out += '<div class="prog-rail"><div class="prog-bar" style="width:'+Math.round(done/GOALS.length*100)+'%"></div></div>';
  out += '</div>';

  // Confirmed bookings
  out += '<div class="label mb3">Confirmed bookings</div>';
  out += '<div class="card mb4">';
  var bkeys=['bcn-ibz','ibz-bcn'];
  for(var i=0;i<bkeys.length;i++){
    var b=BK[bkeys[i]];
    out += '<div class="list-row">';
    out += '<div class="ico ico-ok"><i class="ph-fill ph-airplane"></i></div>';
    out += '<div class="grow1"><div class="title">'+b.from+' → '+b.to+'</div><div class="cap mt1">'+b.date+' · '+b.fl+' · €'+b.eur+'</div></div>';
    out += '<span class="badge b-ok"><i class="ph-fill ph-check-circle"></i>'+b.ref+'</span>';
    out += '</div>';
  }
  var stays=[
    {i:'ph-bed',t:"Wombat's Munich",s:'24 Jun',e:'€64.10'},
    {i:'ph-bed',t:'Hans Brinker Amsterdam',s:'25–28 Jun',e:null},
    {i:'ph-bed',t:'MEININGER Innsbruck',s:'22–24 Jun',e:null},
    {i:'ph-bed',t:'Generator Madrid',s:'8–10 Jul',e:null},
    {i:'ph-bed',t:'Itaca Barcelona',s:'11–13 Jul',e:null},
    {i:'ph-bed',t:'Giramundo Ibiza',s:'13–15 Jul',e:null},
    {i:'ph-airplane',t:'Transavia AMS→OPO',s:'IE43SW',e:null},
    {i:'ph-airplane',t:'TAP Portugal',s:'Z7GFA9',e:null},
  ];
  for(var i=0;i<stays.length;i++){
    var s=stays[i];
    out += '<div class="list-row">';
    out += '<div class="ico ico-ok"><i class="ph-fill '+s.i+'"></i></div>';
    out += '<div class="grow1"><div class="title">'+s.t+'</div><div class="cap mt1">'+s.s+(s.e?' · '+s.e:'')+'</div></div>';
    out += '<span class="badge b-ok"><i class="ph-fill ph-check-circle"></i></span>';
    out += '</div>';
  }
  out += '</div>';
  out += '</div>';

  g('pToday').innerHTML = out;
  // Update theme icon
  var tb=g('themeBtn');
  if(tb) tb.querySelector('i').className = dark ? 'ph ph-moon' : 'ph ph-sun';
}

/* ─── TIMELINE ───────────────────────────────────────────── */
function renderTimeline(){
  var ts=TODAY.toISOString().split('T')[0];
  var out='';
  var lp=0;
  for(var i=0;i<DAYS.length;i++){
    var d=DAYS[i];
    if(d.p!==lp){
      lp=d.p;
      out+='<div class="phase-hdr">';
      out+='<div class="phase-dot" style="background:'+PC[d.p]+'"></div>';
      out+='<span class="phase-label" style="color:'+PC[d.p]+'">'+PN[d.p]+'</span>';
      out+='</div>';
    }
    var today=d.d===ts;
    var dn=dayNum(d.d);
    var noAc=!d.a&&d.t!=='travel'&&d.t!=='home';

    out+='<div class="day-wrap">';
    out+='<div class="day-card'+(today?' today':'')+'">';

    // Header
    out+='<div class="day-hdr'+(today?' today':'')+'">';
    out+='<span class="day-date'+(today?' today':'')+'">'+fmt(d.d)+'</span>';
    out+='<span class="day-num'+(today?' today':'')+'">Day '+dn+'</span>';
    out+='</div>';

    // Body
    out+='<div class="day-body">';
    out+='<div class="day-city'+(today?' today':'')+'">';
    out+='<span class="day-city-em">'+d.e+'</span>';
    out+=d.c;
    out+='</div>';

    // Badges
    var bgs=[];
    if(d.a) bgs.push('<span class="badge '+(d.r?'b-ok':'b-warn')+'">'+(d.r?'<i class="ph-fill ph-check-circle"></i>'+d.a:'<i class="ph-fill ph-warning-circle"></i>'+d.a)+'</span>');
    if(noAc) bgs.push('<span class="badge b-warn"><i class="ph-fill ph-warning-circle"></i>Book accommodation</span>');
    if(d.t==='event') bgs.push('<span class="badge b-ac"><i class="ph-fill ph-lock-simple"></i>Locked</span>');
    if(bgs.length) out+='<div class="day-badges">'+bgs.join('')+'</div>';

    // Flight
    if(d.bk&&BK[d.bk]){
      var b=BK[d.bk];
      out+='<div class="day-flt">';
      out+='<div class="day-flt-route"><span class="day-flt-code">'+b.from+'</span><i class="ph-fill ph-airplane-in-flight day-flt-arrow"></i><span class="day-flt-code">'+b.to+'</span></div>';
      out+='<div class="day-flt-meta">'+b.fl+' · '+b.dep+'–'+b.arr+' · Seat '+b.seat+' · €'+b.eur+'</div>';
      out+='</div>';
    }

    // Highlights
    for(var j=0;j<d.th.length;j++){
      var t=d.th[j];
      out+='<div class="day-hl">'+t.replace('🔒 ','')+'</div>';
    }

    out+='</div></div></div>';
  }
  g('pTimeline').innerHTML=out;
}

/* ─── CITIES ─────────────────────────────────────────────── */
function renderCities(){
  var keys=Object.keys(GUIDES);
  var chips='<div class="city-scroll">';
  for(var i=0;i<keys.length;i++){
    chips+='<button class="city-chip'+(keys[i]===city?' on':'')+'" onclick="selCity(\''+keys[i]+'\')">'+keys[i]+'</button>';
  }
  chips+='</div>';
  g('pCities').innerHTML=chips+'<div id="gInner"></div>';
  renderGuide();
}

function selCity(c){
  city=c;
  var chips=document.querySelectorAll('.city-chip');
  for(var i=0;i<chips.length;i++) chips[i].classList.toggle('on',chips[i].textContent===c);
  renderGuide();
  var inner=g('gInner');
  if(inner) inner.scrollIntoView({behavior:'smooth'});
}

function renderGuide(){
  var gu=GUIDES[city]; if(!gu)return;
  var days=DAYS.filter(function(d){return d.c.indexOf(city)!==-1;});
  var sub=days.length?fmt(days[0].d)+(days.length>1?' · '+days.length+' nights'):'';
  var bg=HERO_BG[city]||'135deg,#555,#333';

  var out='<div class="city-hero">';
  out+='<div class="city-hero-bg" style="background:linear-gradient('+bg+')"></div>';
  out+='<div class="city-hero-em">'+gu.e+'</div>';
  out+='<div class="city-hero-grad"></div>';
  out+='<div class="city-hero-txt"><div class="city-hero-name">'+city+'</div><div class="city-hero-sub">'+sub+'</div></div>';
  out+='</div>';

  out+='<div class="px pt4">';

  // Reviews
  if(gu.reviews&&gu.reviews.length){
    out+='<div class="guide-sec">';
    out+='<div class="guide-hdr"><div class="guide-hdr-icon"><i class="ph-fill ph-star"></i></div><span class="guide-hdr-label">Insider Tips</span></div>';
    for(var i=0;i<gu.reviews.length;i++){
      var rv=gu.reviews[i];
      out+='<div class="review-card">';
      out+='<div class="row between mb2"><span class="review-place">'+rv.p+'</span><span class="review-rating stars">'+rv.r+' '+stars(rv.r)+'</span></div>';
      out+='<div class="review-txt">'+rv.t+'</div>';
      out+='</div>';
    }
    out+='</div>';
  }

  // Guide sections
  for(var i=0;i<GSECS.length;i++){
    var s=GSECS[i];
    var items=gu[s.k]; if(!items||!items.length) continue;
    out+='<div class="guide-sec">';
    out+='<div class="guide-hdr"><div class="guide-hdr-icon"><i class="ph '+s.ph+'"></i></div><span class="guide-hdr-label">'+s.l+'</span></div>';
    for(var j=0;j<items.length;j++) out+='<div class="guide-item">'+items[j]+'</div>';
    out+='</div>';
  }
  out+='</div>';
  g('gInner').innerHTML=out;
}

/* ─── GOALS ──────────────────────────────────────────────── */
function renderGoals(){
  var done=0; for(var i=0;i<GOALS.length;i++) if(gs[GOALS[i].id]) done++;
  var out='<div class="px pt5">';
  out+='<div class="card card-ac mb5">';
  out+='<div class="row between mb3"><span class="title accent">Non-negotiables</span><span class="title accent">'+done+' / '+GOALS.length+'</span></div>';
  out+='<div class="prog-rail" style="height:5px"><div class="prog-bar" style="width:'+Math.round(done/GOALS.length*100)+'%;height:100%"></div></div>';
  out+='</div>';

  var cats=['Travel','Fitness','Photography','Design'];
  var catIcons={Travel:'ph-airplane',Fitness:'ph-barbell',Photography:'ph-aperture',Design:'ph-ruler'};
  for(var c=0;c<cats.length;c++){
    var cat=cats[c];
    var catDone=0;
    for(var i=0;i<GOALS.length;i++) if(GOALS[i].cat===cat&&gs[GOALS[i].id]) catDone++;
    var catTotal=0;
    for(var i=0;i<GOALS.length;i++) if(GOALS[i].cat===cat) catTotal++;

    out+='<div class="goal-cat-hdr"><div class="row between">';
    out+='<div class="row gap2"><i class="ph '+catIcons[cat]+'" style="color:var(--tx3)"></i>'+cat+'</div>';
    out+='<span>'+catDone+' / '+catTotal+'</span>';
    out+='</div></div>';

    for(var i=0;i<GOALS.length;i++){
      var go=GOALS[i]; if(go.cat!==cat) continue;
      var on=!!gs[go.id];
      out+='<div class="goal-item" onclick="tog(\''+go.id+'\')">'+
             '<div class="goal-chk'+(on?' on':'')+'"></div>'+
             '<div class="goal-lbl'+(on?' done':'')+'">'+go.l+'</div>'+
             (go.locked?'<span class="goal-locked"><i class="ph-fill ph-lock-simple"></i> Locked</span>':'')+
           '</div>';
    }
  }
  out+='</div>';
  g('pGoals').innerHTML=out;
}

function tog(id){
  gs[id]=!gs[id];
  localStorage.setItem('lk_g',JSON.stringify(gs));
  renderGoals(); renderToday();
}

/* ─── BUDGET ─────────────────────────────────────────────── */
function renderBudget(){
  var tB=0,tA=0;
  for(var i=0;i<BCATS.length;i++){
    tB+=parseFloat(bs[BCATS[i]+'_b']||0);
    tA+=parseFloat(bs[BCATS[i]+'_a']||0);
  }
  var over=tA>tB&&tB>0;
  var out='<div class="px pt5">';

  // Hero tiles
  out+='<div class="budget-hero">';
  out+='<div class="budget-tile"><div class="budget-tile-label">Budget</div><div class="budget-tile-num accent" id="tB">A$'+Math.round(tB).toLocaleString()+'</div></div>';
  out+='<div class="budget-tile"><div class="budget-tile-label">Spent</div><div class="budget-tile-num'+(over?' over':'')+'" id="tA">A$'+Math.round(tA).toLocaleString()+'</div></div>';
  out+='</div>';

  // Confirmed costs
  out+='<div class="label mb3">Confirmed from bookings</div>';
  out+='<div class="card card-ok mb5">';
  out+='<div class="list-row"><div class="ico ico-ok"><i class="ph-fill ph-airplane"></i></div><div class="grow1"><div class="title">BCN → IBZ · Vueling</div><div class="cap mt1">Mon 13 Jul · VY3518</div></div><span class="accent" style="font-weight:700">€65.99</span></div>';
  out+='<div class="list-row"><div class="ico ico-ok"><i class="ph-fill ph-airplane"></i></div><div class="grow1"><div class="title">IBZ → BCN · Vueling</div><div class="cap mt1">Wed 15 Jul · VY3511</div></div><span class="accent" style="font-weight:700">€102.99</span></div>';
  out+='<div class="list-row"><div class="ico ico-ok"><i class="ph-fill ph-bed"></i></div><div class="grow1"><div class="title">Wombat\'s Munich</div><div class="cap mt1">24 Jun · €9.56 online + €56.41 at property</div></div><span class="accent" style="font-weight:700">€64.10</span></div>';
  out+='</div>';

  // Category rows
  out+='<div class="budget-cat-hdr">';
  out+='<div style="flex:1" class="budget-cat-hdr-label">Category</div>';
  out+='<div style="width:80px;text-align:right" class="budget-cat-hdr-label">Budget</div>';
  out+='<div style="width:80px;text-align:right" class="budget-cat-hdr-label">Actual</div>';
  out+='</div>';

  for(var i=0;i<BCATS.length;i++){
    var cat=BCATS[i];
    out+='<div class="budget-row">';
    out+='<div class="ico"><i class="ph '+(BICONS[cat]||'ph-tag')+'"></i></div>';
    out+='<div class="budget-row-name">'+cat+'</div>';
    out+='<input class="binp" type="number" inputmode="numeric" placeholder="0" value="'+(bs[cat+'_b']||'')+'" oninput="savB(\''+cat+'\',\'b\',this.value)">';
    out+='<input class="binp actual" type="number" inputmode="numeric" placeholder="0" value="'+(bs[cat+'_a']||'')+'" oninput="savB(\''+cat+'\',\'a\',this.value)">';
    out+='</div>';
  }
  out+='</div>';
  g('pBudget').innerHTML=out;
}

function savB(cat,f,v){
  bs[cat+'_'+f]=v;
  localStorage.setItem('lk_b',JSON.stringify(bs));
  var tB=0,tA=0;
  for(var i=0;i<BCATS.length;i++){
    tB+=parseFloat(bs[BCATS[i]+'_b']||0);
    tA+=parseFloat(bs[BCATS[i]+'_a']||0);
  }
  var b=g('tB'),a=g('tA');
  if(b) b.textContent='A$'+Math.round(tB).toLocaleString();
  if(a){
    a.textContent='A$'+Math.round(tA).toLocaleString();
    a.className='budget-tile-num'+(tA>tB&&tB>0?' over':'');
  }
}

/* ─── Navigation ─────────────────────────────────────────── */
function go(name,btn){
  var panes=document.querySelectorAll('.pane');
  for(var i=0;i<panes.length;i++) panes[i].classList.remove('on');
  var nbtns=document.querySelectorAll('.nbtn');
  for(var i=0;i<nbtns.length;i++){
    var nb=nbtns[i];
    nb.classList.remove('on');
    var ic=nb.querySelector('i');
    if(ic) ic.className='ph '+nb.getAttribute('data-icon');
  }
  g('p'+name).classList.add('on');
  btn.classList.add('on');
  var activeIcon=btn.querySelector('i');
  if(activeIcon) activeIcon.className='ph-fill '+btn.getAttribute('data-icon');
  try{ g('main').scrollTo({top:0,behavior:'instant'}); }catch(e){}
}

/* ─── Theme ──────────────────────────────────────────────── */
function applyTheme(){
  document.body.classList.toggle('light',!dark);
  g('themeColor').content = dark ? '#0d0d0d' : '#f4f2ef';
  var tb=g('themeBtn');
  if(tb) tb.querySelector('i').className = dark ? 'ph ph-moon' : 'ph ph-sun';
}
function toggleTheme(){
  dark=!dark;
  localStorage.setItem('lk_t',dark?'dark':'light');
  applyTheme();
}

function openSheet(){ g('installOvl').classList.add('on'); document.body.style.overflow='hidden'; }
function closeSheet(){ g('installOvl').classList.remove('on'); document.body.style.overflow=''; }

try {
  boot();
} catch(e) {
  var ep = g('pToday');
  if(ep) ep.innerHTML = '<div style="padding:24px 16px;color:#f87171">'
    +'<div style="font-size:17px;font-weight:700;margin-bottom:8px">App error</div>'
    +'<div style="font-size:13px;opacity:.8;word-break:break-all">'+(e.message||String(e))+'</div>'
    +'<div style="font-size:11px;margin-top:12px;opacity:.5">'+((e.stack||'').split('\n')[1]||'')+'</div>'
    +'</div>';
}
</script>
</body>
</html>
